# ==============================================================================
# Production Nginx Configuration for Institutional Quant Alpha Engine
# Handles HTTP/2, TLS 1.3, Full-Duplex WebSockets, and Rate Limiting
# ==============================================================================

# Rate Limiting Zone for Order & Ingest Submissions
limit_req_zone $binary_remote_addr zone=quant_api_limit:10m rate=50r/s;

# Upstream Backend Pool
upstream quant_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# HTTP to HTTPS Strict Redirect
server {
    listen 80;
    listen [::]:80;
    server_name quant.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quant.example.com;

    # TLS Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/quant.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quant.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/quant.example.com/chain.pem;

    # High-Security TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Institutional Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Buffering Limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # 1. Full-Duplex Low-Latency WebSockets (/api/v1/ws/*)
    location /api/v1/ws/ {
        proxy_pass http://quant_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and extend timeouts for persistent ticker feeds
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. REST API & MCP Endpoints with Rate Limiting
    location /api/ {
        limit_req zone=quant_api_limit burst=100 nodelay;
        proxy_pass http://quant_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 3. Interactive Web Workbench SPA, Static Assets & HTML Tear Sheets
    location / {
        proxy_pass http://quant_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
