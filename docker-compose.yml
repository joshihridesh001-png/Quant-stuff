services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quant_db}
      POSTGRES_USER: ${POSTGRES_USER:-quant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  quant_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_engine_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://quant_user:quant_password@postgres:5432/quant_db}
      DUCKDB_PATH: /app/data/market_data.duckdb
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-quant_super_secret_jwt_key_replace_in_prod}
      API_KEY_SECRET: ${API_KEY_SECRET:-quant_super_secret_api_key_replace_in_prod}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      BROKER_TYPE: ${BROKER_TYPE:-paper}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    volumes:
      - quant_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  quant_data:
